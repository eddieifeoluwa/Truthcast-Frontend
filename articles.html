<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles — TruthCast</title>
<meta name="description" content="The TruthCast journal: ideas on reputation, impact, perception and legacy for public voices, podcasters and brands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="articles">
<div id="site-header"></div>

<header class="art-head">
  <div class="wrap">
    <span class="kicker">The TruthCast journal</span>
    <h1>Ideas on reputation, <em>impact &amp; legacy.</em></h1>
    <p class="lead">Short reads for public voices, podcasters and brands on perception, trust and the long story your name is telling.</p>
  </div>
</header>

<section style="padding-top:20px">
  <div class="wrap">
    <a class="feature rv" id="feature" href="#"></a>
    <div class="filters" id="filters" role="group" aria-label="Filter by topic"></div>
    <div class="posts" id="grid"></div>
  </div>
</section>

<section class="final" style="padding-top:0">
  <div class="wrap">
    <div class="final-in rv" style="padding:90px 40px">
      <img src="https://images.unsplash.com/photo-1579532536935-619928decd08?ixlib=rb-4.1.0&auto=format&fit=crop&w=2000&q=70" alt="">
      <span class="kicker" style="justify-content:center">Stay close</span>
      <h2>New articles, <em>straight to you.</em></h2>
      <p class="lead">Get each new piece from the TruthCast journal by email.</p>
      <div class="ctas"><a class="btn btn-lime" href="mailto:hello@truthcast.io?subject=Subscribe%20to%20the%20TruthCast%20journal">Subscribe →</a></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/articles.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  const all = window.TC_ARTICLES || [];
  const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const [first, ...rest] = all;

  const f = document.getElementById('feature');
  if (first) {
    f.href = 'article.html?a=' + first.slug;
    f.innerHTML = `<div class="post-img"><img src="${first.cover}" alt="${first.coverAlt}"></div>
      <div class="post-body">
        <div class="post-meta"><span>Latest · ${first.category}</span><span>${fmt(first.date)}</span></div>
        <h3>${first.title}</h3><p>${first.excerpt}</p>
        <span class="btn btn-ghost" style="align-self:flex-start;margin-top:8px">Read article →</span>
      </div>`;
  }

  const cats = ['All', ...new Set(all.map(a => a.category))];
  const filters = document.getElementById('filters');
  const grid = document.getElementById('grid');
  let current = new URLSearchParams(location.search).get('c') || 'All';
  if (!cats.includes(current)) current = 'All';

  function render() {
    filters.innerHTML = cats.map(c => `<button data-c="${c}" class="${c === current ? 'on' : ''}">${c}</button>`).join('');
    const list = current === 'All' ? rest : all.filter(a => a.category === current);
    f.style.display = current === 'All' ? '' : 'none';
    grid.innerHTML = list.map(tcCard).join('') || '<p style="color:var(--muted)">No articles in this topic yet.</p>';
    tcReveal();
  }
  filters.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    current = b.dataset.c;
    history.replaceState(null, '', current === 'All' ? 'articles.html' : 'articles.html?c=' + encodeURIComponent(current));
    render();
  });
  render();
})();
</script>
</body>
</html>
